<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醉月归 | 燕云十六声 · 长乐坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "KaiTi", "SimSun", "Noto Serif SC", serif;
        }
        :root{
            --main:#364b44;
            --sec:#597068;
            --light:#89a89e;
            --bg-mask:rgba(252,254,253,0.84);
            --card-bg:#ffffff;
        }
        body {
            background: #f6f8f7;
            color: var(--main);
            background-image: url("https://pic.616pic.com/bg_w1180/00/13/04/50J7VwY96o.jpg");
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            overflow-x:hidden;
        }
        .petal{
            position:fixed;
            z-index:1;
            color:#c8d8d2;
            pointer-events:none;
            animation: fall linear infinite;
            opacity:0.7;
        }
        @keyframes fall{
            0%{transform:translateY(-10vh) rotate(0deg);opacity:0.6;}
            100%{transform:translateY(105vh) rotate(360deg);opacity:0;}
        }
        .mask {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-mask);
            position:relative;
            z-index:2;
        }
        header {
            text-align: center;
            padding: 70px 20px 35px;
        }
        header h1 {
            font-size: 52px;
            color: var(--main);
            letter-spacing: 14px;
            margin-bottom:12px;
            text-shadow:0 1px 4px rgba(0,0,0,0.08);
        }
        header .sub {
            font-size:19px;
            color:var(--sec);
        }
        header .slogan {
            margin-top:18px;
            font-size:22px;
            color:var(--sec);
            letter-spacing:2px;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding:16px;
            background: rgba(255,255,255,0.58);
            backdrop-filter: blur(5px);
            position:sticky;
            top:0;
            z-index:99;
        }
        nav a {
            padding:9px 20px;
            text-decoration:none;
            color:var(--main);
            border-radius:7px;
            transition:0.3s;
            font-size:16px;
        }
        nav a:hover,nav a.active {
            background:#d9e7e2;
        }
        section {
            max-width:1120px;
            margin:45px auto;
            padding:0 20px;
        }
        .box {
            background:rgba(255,255,255,0.72);
            padding:34px;
            border-radius:16px;
            backdrop-filter: blur(7px);
            margin-bottom:32px;
            box-shadow: 0 4px 16px rgba(40,70,60,0.06);
        }
        .box h2 {
            font-size:27px;
            color:var(--main);
            border-left:4px solid var(--light);
            padding-left:15px;
            margin-bottom:22px;
        }
        .member-wrap {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(245px,1fr));
            gap:20px;
        }
        .card {
            background:var(--card-bg);
            padding:20px;
            border-radius:12px;
            border:1px solid #dde8e4;
            transition:0.3s;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow:0 6px 14px rgba(40,70,60,0.08);
        }
        .card h3 {
            color:var(--main);
            margin-bottom:7px;
            font-size:19px;
        }
        .card .role {
            color:var(--sec);
            font-size:14px;
        }
        .card .desc {
            margin-top:12px;
            font-size:15px;
            line-height:1.6;
        }
        .btn {
            display:inline-block;
            margin-top:14px;
            padding:7px 14px;
            background:var(--light);
            color:#fff;
            border:none;
            border-radius:7px;
            cursor:pointer;
            transition:0.3s;
            font-family:inherit;
            font-size:15px;
        }
        .btn:hover {
            background:#749489;
        }
        .btn-danger{
            background:#b8c8c3;
        }
